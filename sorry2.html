<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorry — Please Forgive Me</title>
  <style>
    :root{ --accent: #ff4961; --soft:#ffd6e0; --card:#ffffffcc }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
    body{display:grid;place-items:center;background:linear-gradient(120deg,#1b6b9b 0%, #7ad7ff 40%, #ffd6e0 100%);overflow:hidden}

    /* floating hearts */
    .heart{position:absolute;width:12px;height:12px;background:var(--accent);transform:rotate(45deg);border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
    .heart:after,.heart:before{content:'';position:absolute;background:var(--accent);width:12px;height:12px;border-radius:50%}
    .heart:before{top:-6px;left:0}
    .heart:after{left:6px;top:0}

    .card{width:min(720px,94%);background:var(--card);backdrop-filter:blur(6px);border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,0.15);text-align:center;position:relative;overflow:hidden}
    h1{margin:0 0 8px;font-size:28px;color:#222}
    p.lead{margin:0 0 18px;color:#333;font-size:16px}
    .message{font-size:20px;line-height:1.4;margin:12px 0 18px}

    .emoji-row{font-size:28px;margin-bottom:12px}

    .buttons{display:flex;gap:12px;justify-content:center;margin-top:12px}
    button{padding:12px 22px;border-radius:999px;border:0;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.08);transition:transform .18s ease, box-shadow .18s ease}
    button:active{transform:translateY(2px)}
    .yes{background:linear-gradient(90deg,#ff7aa2,#ff4961);color:white}
    .no{background:white;border:2px solid #ff7aa2;color:#ff4961}

    .small-note{font-size:13px;color:#555;margin-top:14px}

    /* confetti/hearts animation */
    @keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-420px) scale(.5);opacity:0}}
    .floating{position:absolute;left:50%;transform:translateX(-50%);bottom:-40px;pointer-events:none}

    /* simple responsive */
    @media (max-width:420px){h1{font-size:22px}.message{font-size:18px}}

    /* subtle sparkle */
    .sparkle{position:absolute;top:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), transparent 40%);filter:blur(10px);opacity:.6}
  </style>
</head>
<body>
  <div class="sparkle"></div>
  <div class="card" role="dialog" aria-labelledby="title" aria-describedby="desc">
    <div class="emoji-row">🥺💖🌸</div>
    <h1 id="title">I'm so sorry, my princess</h1>
    <p class="lead" id="desc">I know I scolded and shouted — that was wrong. I miss your smile and your warmth.muje mad krdo baba apto meri jaan💕</p>

    <div class="message">I am sorry. I love you. <span style="font-size:22px">💕</span></div>

    <div class="buttons" id="buttons">
      <button class="yes" id="yesBtn">Yes — I forgive you 💞</button>
      <button class="no" id="noBtn">No — huh 😢</button>
    </div>

    <div class="small-note" id="note">MAIN APSE BOHOT PYAR KRTA OR APKI BOHOT PRWA MERE KO FR ❤️.</div>
  </div>

  <!-- floating hearts generated by JS -->

  <script>
    // small helper to create floating hearts for a cute background
    function spawnHearts(count){
      for(let i=0;i<count;i++){
        const h=document.createElement('div');
        h.className='heart';
        const size=8+Math.random()*18;
        h.style.width=size+'px';
        h.style.height=size+'px';
        h.style.left=(Math.random()*100)+'%';
        h.style.bottom=(-20-Math.random()*50)+'px';
        h.style.opacity=0.85;
        h.style.transform='rotate(45deg)';
        document.body.appendChild(h);
        const dur=6+Math.random()*6;
        h.style.transition='transform '+dur+'s linear, bottom '+dur+'s linear, opacity 1s ease '+dur+'s';
        // float upward a bit later
        setTimeout(()=>{
          h.style.bottom=(40+Math.random()*420)+'px';
          h.style.opacity='0';
        }, 100);
        // remove after animation
        setTimeout(()=>h.remove(), (dur+1)*1000);
      }
    }
    // spawn a few hearts on load and then occasionally
    spawnHearts(8);
    setInterval(()=>spawnHearts(3), 1800);

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const buttons = document.getElementById('buttons');
    const note = document.getElementById('note');

    yesBtn.addEventListener('click', ()=>{
      // show gratitude + little animation
      yesBtn.disabled = true;
      yesBtn.textContent = 'Thank you… I love you 💖';
      yesBtn.style.transform = 'scale(1.02)';
      // create a burst of hearts
      for(let i=0;i<18;i++){
        setTimeout(()=>spawnHearts(1), i*60);
      }
      note.textContent = 'I promise to be kinder. You mean the world to me.';
    });

    noBtn.addEventListener('click', ()=>{
      // If she chooses No: remove the option and leave Yes only
      noBtn.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(.85)'}],{duration:400, easing:'ease'});
      setTimeout(()=>{
        noBtn.remove();
        // update note and slightly emphasize Yes
        note.textContent = 'I respect your feelings. If you change your mind, please tap Yes.';
        yesBtn.focus();
        yesBtn.animate([{boxShadow:'0 6px 18px rgba(0,0,0,.08)'},{boxShadow:'0 20px 36px rgba(255,74,97,.28)'}],{duration:600,fill:'forwards'});
      },420);
    });

    // small playful trick: if she tries to click No repeatedly, it will wobble
    let noAttempts=0;
    noBtn.addEventListener('mouseover', ()=>{
      noAttempts++;
      if(noAttempts>1){
        // nudge the No button away slightly to be playful but not mean
        noBtn.style.transform = 'translateX(' + ( (Math.random()*120) - 60 ) + 'px)';
        setTimeout(()=>{noBtn.style.transform='translateX(0)';},350);
      }
    });
  </script>
</body>
</html>
